<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <!-- Soft shadow underneath -->
  <ellipse cx="160" cy="205" rx="110" ry="10" fill="#E8E4DC" opacity="0.6"/>
  
  <!-- Left person (blue shirt / hoodie) -->
  <g id="person-left">
    <!-- Hair back -->
    <path d="M75 90 C70 70 85 55 105 55 C120 55 130 65 132 85 Z" fill="#6A4E3A"/>
    <!-- Head -->
    <circle cx="102" cy="85" r="24" fill="#FCD5B5"/>
    <ellipse cx="102" cy="88" rx="20" ry="22" fill="#FCD5B5"/>
    <!-- Hair front -->
    <path d="M78 80 C82 60 100 56 122 62 C120 72 108 72 98 75 C88 78 80 84 78 80 Z" fill="#4A3425"/>
    <!-- Face details -->
    <circle cx="94" cy="84" r="2.5" fill="#2E2018"/>
    <circle cx="108" cy="84" r="2.5" fill="#2E2018"/>
    <path d="M96 95 Q102 100 108 95" stroke="#D36B46" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="88" cy="88" rx="3.5" ry="2" fill="#FFA5A5" opacity="0.6"/>
    <ellipse cx="114" cy="88" rx="3.5" ry="2" fill="#FFA5A5" opacity="0.6"/>
    
    <!-- Neck -->
    <rect x="96" y="106" width="12" height="12" fill="#FCD5B5"/>
    
    <!-- Torso / Blue shirt -->
    <path d="M75 118 C85 112 118 112 128 118 L138 200 L65 200 Z" fill="#3D6888"/>
    <!-- Collar -->
    <path d="M92 118 Q102 126 112 118" stroke="#2B4960" stroke-width="3" fill="none"/>
    
    <!-- Arm holding sign -->
    <path d="M124 130 Q145 145 155 148" stroke="#FCD5B5" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Right person (orange / Crust shirt) -->
  <g id="person-right">
    <!-- Hair back -->
    <path d="M190 85 C190 62 208 52 228 54 C245 56 252 70 250 90 Z" fill="#D48B38"/>
    <!-- Head -->
    <circle cx="222" cy="82" r="23" fill="#FBE0C6"/>
    <!-- Hair front curls -->
    <path d="M198 74 C205 60 226 56 242 66 C238 72 226 70 216 75 C208 80 200 82 198 74 Z" fill="#B36E20"/>
    <!-- Face details -->
    <circle cx="214" cy="81" r="2.5" fill="#2E2018"/>
    <circle cx="228" cy="81" r="2.5" fill="#2E2018"/>
    <path d="M216 92 Q222 97 228 92" stroke="#D36B46" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="208" cy="85" rx="3.5" ry="2" fill="#FFA5A5" opacity="0.6"/>
    <ellipse cx="234" cy="85" rx="3.5" ry="2" fill="#FFA5A5" opacity="0.6"/>
    
    <!-- Neck -->
    <rect x="216" y="102" width="12" height="12" fill="#FBE0C6"/>
    
    <!-- Torso / Orange polo -->
    <path d="M196 114 C206 108 238 108 248 114 L258 200 L186 200 Z" fill="#ED7D31"/>
    <!-- Collar -->
    <path d="M212 114 Q222 122 232 114" stroke="#D96B20" stroke-width="3" fill="none"/>
    
    <!-- Arm holding sign -->
    <path d="M198 128 Q178 142 168 148" stroke="#FBE0C6" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Orange Community Sign held by both -->
  <g id="community-board" transform="rotate(-2 160 150)">
    <!-- Board drop shadow -->
    <rect x="110" y="125" width="102" height="64" rx="8" fill="#B54A05" opacity="0.3"/>
    <!-- Main board -->
    <rect x="108" y="122" width="102" height="64" rx="8" fill="#ED7D31" stroke="#D96B20" stroke-width="2"/>
    <rect x="112" y="126" width="94" height="56" rx="5" fill="none" stroke="#FFA767" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Small pizza icon & text on sign -->
    <path d="M159 135 L153 148 L165 148 Z" fill="#FFFFFF"/>
    <circle cx="157" cy="143" r="1.5" fill="#ED7D31"/>
    <circle cx="161" cy="145" r="1.2" fill="#ED7D31"/>
    
    <!-- Text on sign -->
    <text x="159" y="159" font-family="'Barlow Condensed', sans-serif" font-weight="800" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CRUST CARES</text>
    <text x="159" y="169" font-family="sans-serif" font-weight="600" font-size="6" fill="#FFE5D3" text-anchor="middle">COMMUNITY FIRST</text>
  </g>

  <!-- Hands gripping the board -->
  <!-- Left person's hand -->
  <circle cx="132" cy="148" r="6.5" fill="#FCD5B5"/>
  <ellipse cx="131" cy="144" rx="4" ry="2.5" fill="#E8B793"/>
  <!-- Right person's hand -->
  <circle cx="188" cy="148" r="6.5" fill="#FBE0C6"/>
  <ellipse cx="189" cy="144" rx="4" ry="2.5" fill="#E2BA9A"/>
</svg>
